name: Harpoon
description: >-
  Harpoon is a no-code Kubernetes deployment platform that lets teams deploy
  commercial or open-source software to Kubernetes clusters in seconds using a
  drag-and-drop interface, without writing code or configuration scripts. It
  automates cloud account security, cluster provisioning and autoscaling across
  AWS, Azure, Google Cloud and VMware, and integrates with CI/CD tooling such as
  GitHub, GitLab, Jenkins, Argo, Docker Hub and Harbor. The product is delivered
  as a hosted web application (app.harpooncorp.com) aimed at both startups and
  enterprises; it is surfaced here as an a16z portfolio lead. As of this
  enrichment pass Harpoon publishes no public REST API, OpenAPI specification,
  SDK, CLI or webhook surface.
